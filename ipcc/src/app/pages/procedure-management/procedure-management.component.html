<div class="procedure-management-host-wrapper" style="width: 100%; height: 100%; min-height: 600px; position: relative;">
  <!-- Loading indicator khi đang nạp bundle -->
  <div *ngIf="isLoading" style="display: flex; align-items: center; justify-content: center; height: 300px; color: #6b7280;">
    <span>Đang tải phân hệ Quản lý quy trình...</span>
  </div>

  <!-- Thẻ Web Component chuẩn HTML <process-procedure-app> -->
  <process-procedure-app *ngIf="isLoaded"></process-procedure-app>
</div>
