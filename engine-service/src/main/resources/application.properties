spring.application.name=engine-service
server.port=${SERVER_PORT:8002}
server.shutdown=graceful
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.lifecycle.timeout-per-shutdown-phase=20s

# i18n/common-messages nằm trong common-core (response.success, mã lỗi 1xxx); key trùng thì file của service thắng
spring.messages.basename=i18n/messages,i18n/common-messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.datasource.url=${DATASOURCE_URL:jdbc:mariadb://localhost:3307/flow_engine}
spring.datasource.username=${DATASOURCE_USERNAME:flow_engine}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=engine-hikari
spring.datasource.hikari.maximum-pool-size=${DATASOURCE_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DATASOURCE_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# engine-service không có entity JPA (common-core kéo JPA vào classpath); bảng ACT_* do Flowable quản lý
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.data.redis.repositories.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false

# Flowable. database-schema-update=true chỉ dùng ở local, production phải kiểm soát việc nâng cấp schema ACT_*.
flowable.database-schema-update=${FLOWABLE_DATABASE_SCHEMA_UPDATE:false}
flowable.async-executor-activate=${FLOWABLE_ASYNC_EXECUTOR_ACTIVATE:true}
flowable.history-level=${FLOWABLE_HISTORY_LEVEL:audit}
flowable.idm.enabled=false
flowable.cmmn.enabled=false
flowable.content.enabled=false
flowable.eventregistry.enabled=false

management.server.port=${MANAGEMENT_PORT:9000}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.enabled=${ENABLE_SWAGGER:true}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:true}
logging.pattern.level=%5p [${spring.application.name},%X{requestId:-}]

# Xác thực: API của engine chỉ dành cho service nội bộ (X-API-Key, ROLE_SERVICE).
# common-auth vẫn cần cấu hình Keycloak/MinIO để khởi tạo filter Bearer token.
keycloak.config.resolver=path
keycloak.config.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:}
ticket-flow.auth.public-paths=/actuator/health,/actuator/health/**,/actuator/info,/actuator/prometheus,/v3/api-docs,/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**,/error
ticket-flow.auth.enabled=${TICKETFLOW_AUTH_ENABLED:true}

minio.baseUrl=${MINIO_BASE_URL:http://192.168.10.27:9000}
minio.accessKey=${MINIO_ACCESS_KEY:}
minio.secretKey=${MINIO_SECRET_KEY:}

app.api-key.header-name=X-API-Key
app.api-key.keys=${INTERNAL_API_KEYS:}
app.i18n.default-locale=vi
app.i18n.supported-locales=vi,en

# common-core luôn khởi tạo kết nối Redis (lazy, chưa kết nối khi chưa dùng); engine không dùng cache
app.redis.sentinel=${REDIS_SENTINEL:false}
app.redis.master=${REDIS_MASTER_NAME:mymaster}
app.redis.nodes=${REDIS_SENTINEL_NODES:localhost:26379}
app.redis.host=${REDIS_HOST:localhost}
app.redis.port=${REDIS_PORT:6379}
app.redis.username=${REDIS_USERNAME:}
app.redis.password=${REDIS_PASSWORD:}
app.redis.database=${REDIS_DATABASE:0}
app.redis.ssl=${REDIS_SSL_ENABLED:false}
app.redis.timeout=${REDIS_TIMEOUT:2s}
app.redis.key-prefix=${REDIS_KEY_PREFIX:ticket-flow:engine:}
app.redis.cache-enabled=false
app.redis.cache-default-ttl=10m

# Gọi integration-service khi chạy SYSTEM_TASK / NOTIFICATION.
# mode=stub: không gọi thật, trả kết quả thành công (dùng khi integration-service chưa có API execute).
app.integration.mode=${INTEGRATION_MODE:http}
app.integration.base-url=${INTEGRATION_BASE_URL:http://localhost:8090}
app.integration.service-name=integration-service
app.integration.connect-timeout=${INTEGRATION_CONNECT_TIMEOUT:5s}
app.integration.read-timeout=${INTEGRATION_READ_TIMEOUT:120s}
