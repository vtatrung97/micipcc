spring.application.name=engine-service
server.port=${SERVER_PORT:8000}
server.shutdown=graceful

spring.datasource.url=${DATASOURCE_URL:jdbc:mariadb://localhost:3307/flow_engine}
spring.datasource.username=${DATASOURCE_USERNAME:flow_engine}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=engine-hikari
spring.datasource.hikari.maximum-pool-size=${DATASOURCE_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DATASOURCE_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Local development only. Production schema changes must be controlled.
flowable.database-schema-update=${FLOWABLE_DATABASE_SCHEMA_UPDATE:false}
flowable.async-executor-activate=${FLOWABLE_ASYNC_EXECUTOR_ACTIVATE:true}
flowable.history-level=${FLOWABLE_HISTORY_LEVEL:audit}
flowable.idm.enabled=false
flowable.cmmn.enabled=false
flowable.content.enabled=false
flowable.eventregistry.enabled=false

management.server.port=${MANAGEMENT_PORT:8001}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

logging.pattern.level=%5p [${spring.application.name},%X{requestId:-}]
