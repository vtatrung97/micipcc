spring.application.name=core-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.datasource.url=${DATASOURCE_URL:jdbc:mariadb://localhost:3307/flow_core}
spring.datasource.username=${DATASOURCE_USERNAME:flow_core}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=core-hikari
spring.datasource.hikari.maximum-pool-size=${DATASOURCE_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DATASOURCE_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/table_setup,classpath:db/data_setup
spring.flyway.user=${FLYWAY_USERNAME:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_PASSWORD:${spring.datasource.password}}
spring.data.redis.repositories.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false

management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.enabled=${ENABLE_SWAGGER:true}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:true}
logging.pattern.level=%5p [${spring.application.name},%X{requestId:-}]

# common-auth validates the RPT as a signed JWT. jwk-set-uri avoids issuer discovery at startup.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ticket-flow}}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWK_SET_URI:${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}/realms/${KEYCLOAK_REALM:ticket-flow}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=${KEYCLOAK_AUDIENCE:ticket-flow-api}
ticket-flow.auth.role-clients=${KEYCLOAK_ROLE_CLIENTS:ticket-flow-api}
ticket-flow.auth.token-client.enabled=${KEYCLOAK_TOKEN_CLIENT_ENABLED:false}
ticket-flow.auth.token-client.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}
ticket-flow.auth.token-client.realm=${KEYCLOAK_REALM:ticket-flow}
ticket-flow.auth.token-client.client-id=${KEYCLOAK_CLIENT_ID:ticket-flow-api}
ticket-flow.auth.token-client.client-secret=${KEYCLOAK_CLIENT_SECRET:}
ticket-flow.auth.token-client.audience=${KEYCLOAK_AUDIENCE:ticket-flow-api}
ticket-flow.auth.token-client.connect-timeout=${KEYCLOAK_CONNECT_TIMEOUT:3s}
ticket-flow.auth.token-client.read-timeout=${KEYCLOAK_READ_TIMEOUT:5s}
ticket-flow.auth.public-paths=/api/v1/health-check,/actuator/health,/actuator/health/**,/actuator/info,/actuator/prometheus,/v3/api-docs,/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**,/error

app.api-key.header-name=X-API-Key
app.api-key.keys=${INTERNAL_API_KEYS:}
app.i18n.default-locale=vi
app.i18n.supported-locales=vi,en

app.redis.sentinel=${REDIS_SENTINEL:false}
app.redis.master=${REDIS_MASTER_NAME:mymaster}
app.redis.nodes=${REDIS_SENTINEL_NODES:localhost:26379}
app.redis.host=${REDIS_HOST:localhost}
app.redis.port=${REDIS_PORT:6379}
app.redis.username=${REDIS_USERNAME:}
app.redis.password=${REDIS_PASSWORD:}
app.redis.database=${REDIS_DATABASE:0}
app.redis.ssl=${REDIS_SSL_ENABLED:false}
app.redis.timeout=${REDIS_TIMEOUT:2s}
app.redis.key-prefix=${REDIS_KEY_PREFIX:ticket-flow:core:}
app.redis.cache-enabled=${CACHE_ENABLED:true}
app.redis.cache-default-ttl=${CACHE_DEFAULT_TTL:10m}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
