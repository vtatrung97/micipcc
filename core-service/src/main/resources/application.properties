spring.application.name=core-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.lifecycle.timeout-per-shutdown-phase=20s

# i18n/common-messages nằm trong common-core (response.success, mã lỗi 1xxx); key trùng thì file của service thắng
spring.messages.basename=i18n/messages,i18n/common-messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.datasource.url=${DATASOURCE_URL:jdbc:mariadb://localhost:3307/flow_core}
spring.datasource.username=${DATASOURCE_USERNAME:flow_core}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=core-hikari
spring.datasource.hikari.maximum-pool-size=${DATASOURCE_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DATASOURCE_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.locations=classpath:db/table_setup,classpath:db/data_setup
spring.flyway.user=${FLYWAY_USERNAME:${spring.datasource.username}}
spring.flyway.password=${FLYWAY_PASSWORD:${spring.datasource.password}}
spring.data.redis.repositories.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false

management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.enabled=${ENABLE_SWAGGER:true}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:true}
logging.pattern.level=%5p [${spring.application.name},%X{requestId:-}]

# Keycloak (same as IPCC): realm, client, credentials and policy-enforcer paths come from the adapter config
# on MinIO: keycloak-adapter-config-os/${spring.application.name}.json, loaded once. Only auth-server-url is overridden by env.
keycloak.config.resolver=path
keycloak.config.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:}
ticket-flow.auth.public-paths=/api/v1/health-check,/actuator/health,/actuator/health/**,/actuator/info,/actuator/prometheus,/v3/api-docs,/v3/api-docs/**,/swagger-ui.html,/swagger-ui/**,/error

# MinIO (shared with IPCC 2.0)
minio.baseUrl=${MINIO_BASE_URL:http://192.168.10.27:9000}
minio.accessKey=${MINIO_ACCESS_KEY:}
minio.secretKey=${MINIO_SECRET_KEY:}

app.api-key.header-name=X-API-Key
app.api-key.keys=${INTERNAL_API_KEYS:}
app.i18n.default-locale=vi
app.i18n.supported-locales=vi,en

app.redis.sentinel=${REDIS_SENTINEL:false}
app.redis.master=${REDIS_MASTER_NAME:mymaster}
app.redis.nodes=${REDIS_SENTINEL_NODES:localhost:26379}
app.redis.host=${REDIS_HOST:localhost}
app.redis.port=${REDIS_PORT:6379}
app.redis.username=${REDIS_USERNAME:}
app.redis.password=${REDIS_PASSWORD:}
app.redis.database=${REDIS_DATABASE:0}
app.redis.ssl=${REDIS_SSL_ENABLED:false}
app.redis.timeout=${REDIS_TIMEOUT:2s}
app.redis.key-prefix=${REDIS_KEY_PREFIX:ticket-flow:core:}
app.redis.cache-enabled=${CACHE_ENABLED:true}
app.redis.cache-default-ttl=${CACHE_DEFAULT_TTL:10m}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# Kafka (shared with IPCC 2.0): CDC of ipcc_account.user -> user_account, ipcc_account.keycloak_group -> keycloak_group
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:10.29.75.4:8092}
spring.cloud.stream.kafka.binder.auto-create-topics=false
spring.cloud.stream.kafka.binder.consumer-properties.max.poll.records=100
spring.cloud.stream.kafka.binder.consumer-properties.max.poll.interval.ms=300000
spring.cloud.stream.kafka.binder.consumer-properties.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.cloud.stream.kafka.binder.consumer-properties.value.deserializer=org.apache.kafka.common.serialization.ByteArrayDeserializer

spring.cloud.function.definition=accountUserEventCdc;keycloakGroupCdc
spring.cloud.stream.function.bindings.accountUserEventCdc-in-0=AccountUserEventCdc
spring.cloud.stream.bindings.AccountUserEventCdc.group=${spring.application.name}.ipcc_account.user
spring.cloud.stream.bindings.AccountUserEventCdc.destination=${KAFKA_TOPIC_ACCOUNT_USER:ipcc-2.0-cdc.ipcc_account.user}
spring.cloud.stream.bindings.AccountUserEventCdc.consumer.max-attempts=3
spring.cloud.stream.bindings.AccountUserEventCdc.consumer.retryable-exceptions.java.lang.IllegalStateException=false
spring.cloud.stream.kafka.bindings.AccountUserEventCdc.consumer.ack-mode=batch
spring.cloud.stream.kafka.bindings.AccountUserEventCdc.consumer.enable-dlq=true
spring.cloud.stream.kafka.bindings.AccountUserEventCdc.consumer.start-offset=latest
spring.cloud.stream.kafka.bindings.AccountUserEventCdc.consumer.dlq-producer-properties.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.kafka.bindings.AccountUserEventCdc.consumer.dlq-producer-properties.configuration.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer

spring.cloud.stream.function.bindings.keycloakGroupCdc-in-0=KeycloakGroupCdc
spring.cloud.stream.bindings.KeycloakGroupCdc.group=${spring.application.name}.keycloak_group
spring.cloud.stream.bindings.KeycloakGroupCdc.destination=${KAFKA_TOPIC_KEYCLOAK_GROUP:ipcc-2.0-cdc.ipcc_account.keycloak_group}
spring.cloud.stream.bindings.KeycloakGroupCdc.consumer.max-attempts=3
spring.cloud.stream.bindings.KeycloakGroupCdc.consumer.retryable-exceptions.java.lang.IllegalStateException=false
spring.cloud.stream.kafka.bindings.KeycloakGroupCdc.consumer.ack-mode=batch
spring.cloud.stream.kafka.bindings.KeycloakGroupCdc.consumer.enable-dlq=true
spring.cloud.stream.kafka.bindings.KeycloakGroupCdc.consumer.start-offset=latest
spring.cloud.stream.kafka.bindings.KeycloakGroupCdc.consumer.dlq-producer-properties.configuration.key.serializer=org.apache.kafka.common.serialization.StringSerializer
spring.cloud.stream.kafka.bindings.KeycloakGroupCdc.consumer.dlq-producer-properties.configuration.value.serializer=org.apache.kafka.common.serialization.ByteArraySerializer
