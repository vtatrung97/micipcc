spring.application.name=core-service
server.port=${SERVER_PORT:8080}
server.shutdown=graceful
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.lifecycle.timeout-per-shutdown-phase=20s

spring.messages.basename=i18n/messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.datasource.url=${DATASOURCE_URL:jdbc:mariadb://localhost:3307/flow_core}
spring.datasource.username=${DATASOURCE_USERNAME:flow_core}
spring.datasource.password=${DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.hikari.pool-name=core-hikari
spring.datasource.hikari.maximum-pool-size=${DATASOURCE_POOL_SIZE:20}
spring.datasource.hikari.minimum-idle=${DATASOURCE_MIN_IDLE:5}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.data.redis.repositories.enabled=false
spring.jackson.serialization.write-dates-as-timestamps=false

management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.metrics.tags.application=${spring.application.name}

springdoc.api-docs.enabled=${ENABLE_SWAGGER:true}
springdoc.swagger-ui.enabled=${ENABLE_SWAGGER:true}
logging.pattern.level=%5p [${spring.application.name},%X{requestId:-}]

# Keycloak token validation
keycloak.auth-server-url=${KEYCLOAK_AUTH_SERVER_URL:http://localhost:8180}
keycloak.realm=${KEYCLOAK_REALM:ticket-flow}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:ticket-flow-core}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:}
keycloak.role-clients=${KEYCLOAK_ROLE_CLIENTS:ticket-flow-web,ticket-flow-core}
keycloak.connect-timeout=${KEYCLOAK_CONNECT_TIMEOUT:3s}
keycloak.read-timeout=${KEYCLOAK_READ_TIMEOUT:5s}
keycloak.connection-pool-size=${KEYCLOAK_POOL_SIZE:50}

# Keycloak Admin Client
keycloak-admin-client.enabled=${KEYCLOAK_ADMIN_ENABLED:false}
keycloak-admin-client.auth-server-url=${KEYCLOAK_ADMIN_AUTH_SERVER_URL:${keycloak.auth-server-url}}
keycloak-admin-client.realm=${KEYCLOAK_ADMIN_REALM:${keycloak.realm}}
keycloak-admin-client.client-id=${KEYCLOAK_ADMIN_CLIENT_ID:ticket-flow-core}
keycloak-admin-client.client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:${keycloak.client-secret}}
keycloak-admin-client.master-username=${KEYCLOAK_ADMIN_USERNAME:}
keycloak-admin-client.master-password=${KEYCLOAK_ADMIN_PASSWORD:}

app.security.enabled=${SECURITY_ENABLED:false}
app.api-key.header-name=X-API-Key
app.api-key.keys=${INTERNAL_API_KEYS:}
app.i18n.default-locale=vi
app.i18n.supported-locales=vi,en

app.redis.sentinel=${REDIS_SENTINEL:false}
app.redis.master=${REDIS_MASTER_NAME:mymaster}
app.redis.nodes=${REDIS_SENTINEL_NODES:localhost:26379}
app.redis.host=${REDIS_HOST:localhost}
app.redis.port=${REDIS_PORT:6379}
app.redis.username=${REDIS_USERNAME:}
app.redis.password=${REDIS_PASSWORD:}
app.redis.database=${REDIS_DATABASE:0}
app.redis.ssl=${REDIS_SSL_ENABLED:false}
app.redis.timeout=${REDIS_TIMEOUT:2s}
app.redis.key-prefix=${REDIS_KEY_PREFIX:ticket-flow:core:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
