# Message dùng chung của common-core (Tiếng Việt, mặc định): response.success và mã lỗi nền tảng ErrorCode (1xxx, 9999).
# Service khai báo spring.messages.basename=i18n/messages,i18n/common-messages; key trùng thì file của service được ưu tiên.
response.success=Thành công

####---- Error code (ErrorCode)
err.code.UNCATEGORIZED_EXCEPTION=Đã có lỗi xảy ra, vui lòng thử lại sau
err.code.INVALID_REQUEST=Dữ liệu yêu cầu không hợp lệ
err.code.UNAUTHENTICATED=Phiên đăng nhập không hợp lệ hoặc đã hết hạn
err.code.ACCESS_DENIED=Bạn không có quyền thực hiện chức năng này
err.code.INVALID_CREDENTIALS=Tên đăng nhập hoặc mật khẩu không đúng
err.code.ACCOUNT_DISABLED=Tài khoản đã bị khoá
err.code.ACCOUNT_NOT_READY=Tài khoản chưa hoàn tất thiết lập, vui lòng liên hệ quản trị viên
err.code.INVALID_REFRESH_TOKEN=Refresh token không hợp lệ hoặc đã hết hạn
err.code.INVALID_API_KEY=API key không hợp lệ
err.code.KEYCLOAK_UNAVAILABLE=Hệ thống xác thực đang tạm thời gián đoạn, vui lòng thử lại sau
err.code.KEYCLOAK_CONFIGURATION_ERROR=Cấu hình xác thực của hệ thống chưa đúng, vui lòng liên hệ quản trị viên
err.code.REDIS_UNAVAILABLE=Hệ thống bộ nhớ đệm đang tạm thời gián đoạn, vui lòng thử lại sau
err.code.RESOURCE_NOT_FOUND=Không tìm thấy tài nguyên được yêu cầu
err.code.METHOD_NOT_ALLOWED=Phương thức không được hỗ trợ
err.code.MALFORMED_REQUEST=Nội dung yêu cầu sai định dạng
err.code.SERVICE_UNHEALTHY=Service đang gặp sự cố
err.code.DATA_CONFLICT=Dữ liệu đã được người khác cập nhật, vui lòng tải lại trước khi lưu
