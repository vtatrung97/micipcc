server {
    listen       80;
    server_name  _;

    # Tự động gọt /processX/ khi IPCC gọi sang (Dual Mode)
    rewrite ^/processX/?(.*)$ /$1 last;

    # Phục vụ trực tiếp thư mục dist/processX được mount từ máy host
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Mở CORS
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "*" always;
    }

    # Không cache remoteEntry.js để đảm bảo luôn nạp bản mới
    location ~* remoteEntry\.js$ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Tắt cache hoàn toàn cho js, css, html trong môi trường dev để sửa code là nhận ngay
    location ~* \.(js|css|json)$ {
        root   /usr/share/nginx/html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
        add_header Access-Control-Allow-Origin "*" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
