<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flow System IPCC 2.0 - Dynamic RBAC Menu Navigation</title>
  <style>
    /* ==========================================================================
       ANT DESIGN 5.x / PRO DESIGN TOKENS (OFFLINE / ZERO DEPENDENCY)
       ========================================================================== */
    :root {
      --ant-primary: #1677ff;
      --ant-primary-hover: #4096ff;
      --ant-primary-active: #0958d9;
      --ant-primary-bg: #e6f4ff;
      --ant-success: #52c41a;
      --ant-success-bg: #f6ffed;
      --ant-warning: #fa8c16;
      --ant-warning-bg: #fffbe6;
      --ant-danger: #ff4d4f;
      --ant-danger-bg: #fff1f0;

      --sider-dark-bg: #ffffff;
      --sider-dark-sub-bg: #fafafa;
      --sider-dark-text: #1f2937;
      --sider-dark-text-secondary: #8c8c8c;
      --sider-dark-hover: #f5f5f5;

      --layout-bg: #f0f2f5;
      --card-bg: #ffffff;
      --text-color: #1f2937;
      --text-secondary: #64748b;
      --border-color: #e2e8f0;
      --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
      --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-family);
      background-color: var(--layout-bg);
      color: var(--text-color);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
    }

    /* Enterprise App Layout */
    .app-layout {
      display: flex;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
    }

    /* ==========================================================================
       SIDEBAR NAVIGATION (ANT DESIGN PRO LIGHT THEME)
       ========================================================================== */
    .sider {
      width: 280px;
      height: 100vh;
      background: var(--sider-dark-bg);
      color: var(--sider-dark-text);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: width 0.25s cubic-bezier(0.2, 0, 0, 1);
      border-right: 1px solid #f0f0f0;
      box-shadow: 2px 0 8px rgba(0, 21, 41, 0.05);
      z-index: 100;
      user-select: none;
    }

    .sider.collapsed {
      width: 68px;
    }

    /* Sider Header */
    .sider-header {
      height: 64px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f0f0f0;
      background: #ffffff;
      flex-shrink: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
      overflow: hidden;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--ant-primary);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      flex-shrink: 0;
      font-weight: 800;
      font-size: 15px;
      box-shadow: 0 2px 6px rgba(22, 119, 255, 0.4);
    }

    .brand-text {
      display: flex;
      flex-direction: column;
      white-space: nowrap;
    }

    .brand-title {
      font-size: 14.5px;
      font-weight: 700;
      color: #001529;
      letter-spacing: 0.5px;
    }

    .brand-subtitle {
      font-size: 10.5px;
      color: var(--ant-primary);
      font-weight: 600;
    }

    .collapse-btn {
      background: transparent;
      border: none;
      color: var(--sider-dark-text-secondary);
      padding: 6px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .collapse-btn:hover {
      color: var(--ant-primary);
      background: var(--sider-dark-hover);
    }

    /* RBAC Switcher Toolbar inside Sidebar */
    .rbac-toolbar {
      padding: 12px 14px;
      background: #f8fafc;
      border-bottom: 1px solid #f0f0f0;
      flex-shrink: 0;
    }

    .sider.collapsed .rbac-toolbar {
      display: none;
    }

    .rbac-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .rbac-title {
      font-size: 10px;
      font-weight: 700;
      color: var(--sider-dark-text-secondary);
      letter-spacing: 0.5px;
    }

    .role-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 1px 7px;
      border-radius: 10px;
      text-transform: uppercase;
    }

    .role-badge.ADMIN {
      background: #fff1f0;
      color: var(--ant-danger);
      border: 1px solid #ffa39e;
    }

    .role-badge.SUPERVISOR {
      background: #fffbe6;
      color: #d46b08;
      border: 1px solid #ffe58f;
    }

    .role-badge.AGENT {
      background: #f6ffed;
      color: #389e0d;
      border: 1px solid #b7eb8f;
    }

    .role-pills {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .role-pill {
      background: #ffffff;
      border: 1px solid #d9d9d9;
      color: #595959;
      font-size: 11px;
      padding: 4px 2px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 500;
      text-align: center;
      transition: all 0.2s;
    }

    .role-pill:hover {
      background: #f0f7ff;
      border-color: var(--ant-primary);
      color: var(--ant-primary);
    }

    .role-pill.active {
      background: var(--ant-primary);
      border-color: var(--ant-primary);
      color: #fff;
      font-weight: 600;
      box-shadow: 0 2px 6px rgba(22, 119, 255, 0.25);
    }

    /* Menu Search */
    .menu-search {
      position: relative;
    }

    .menu-search input {
      width: 100%;
      background: #ffffff;
      border: 1px solid #d9d9d9;
      border-radius: 4px;
      color: #262626;
      font-size: 12px;
      padding: 5px 24px 5px 8px;
      outline: none;
      transition: all 0.2s;
    }

    .menu-search input:focus {
      border-color: var(--ant-primary);
      box-shadow: 0 0 0 2px rgba(22, 119, 255, 0.1);
    }

    /* Menu Tree Nav */
    .sider-nav {
      flex: 1;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 8px 0;
      background: #ffffff;
    }

    .sider-nav::-webkit-scrollbar {
      width: 5px;
    }

    .sider-nav::-webkit-scrollbar-thumb {
      background: #d9d9d9;
      border-radius: 3px;
    }

    .menu-tree {
      list-style: none;
    }

    /* Submenu Folder */
    .menu-group {
      margin-bottom: 2px;
    }

    .group-header {
      display: flex;
      align-items: center;
      height: 44px;
      padding: 0 16px;
      cursor: pointer;
      color: #262626;
      transition: all 0.2s;
      position: relative;
    }

    .group-header:hover {
      background: var(--sider-dark-hover);
      color: var(--ant-primary);
    }

    .group-header.has-active-child {
      color: var(--ant-primary);
    }

    .group-icon {
      width: 20px;
      height: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-right: 12px;
      flex-shrink: 0;
      color: #595959;
    }

    .group-header:hover .group-icon {
      color: var(--ant-primary);
    }

    .sider.collapsed .group-icon {
      margin-right: 0;
      width: 100%;
    }

    .group-label {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sider.collapsed .group-label,
    .sider.collapsed .badge-cluster,
    .sider.collapsed .arrow-icon {
      display: none;
    }

    .arrow-icon {
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-left: 8px;
      transition: transform 0.25s ease;
      color: var(--sider-dark-text-secondary);
    }

    .menu-group.open .arrow-icon {
      transform: rotate(180deg);
      color: var(--ant-primary);
    }

    /* Submenu Children */
    .sub-tree {
      list-style: none;
      background: var(--sider-dark-sub-bg);
      padding: 4px 0;
      display: none;
      border-top: 1px solid #f0f0f0;
      border-bottom: 1px solid #f0f0f0;
    }

    .menu-group.open .sub-tree {
      display: block;
    }

    .sider.collapsed .sub-tree {
      display: none !important;
    }

    .leaf-item {
      display: flex;
      align-items: center;
      height: 40px;
      padding: 0 16px 0 44px;
      cursor: pointer;
      color: #595959;
      font-size: 12.5px;
      transition: all 0.2s ease;
      position: relative;
    }

    .leaf-item:hover {
      color: var(--ant-primary);
      background: #f0f7ff;
    }

    .leaf-item.selected {
      background: var(--ant-primary-bg) !important;
      color: var(--ant-primary) !important;
      font-weight: 600;
      border-right: 3px solid var(--ant-primary);
    }

    .leaf-bullet {
      margin-right: 8px;
      font-size: 16px;
      color: #bfbfbf;
    }

    .leaf-item.selected .leaf-bullet {
      color: var(--ant-primary);
    }

    .leaf-text {
      flex: 1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Badge clusters */
    .badge-cluster {
      display: flex;
      align-items: center;
      gap: 5px;
      margin-left: 6px;
    }

    .badge-pill {
      font-size: 11px;
      font-weight: 700;
      height: 18px;
      min-width: 18px;
      padding: 0 6px;
      border-radius: 9px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      line-height: 1;
    }

    .badge-pill.primary {
      background: var(--ant-primary);
      color: #fff;
    }

    .badge-pill.danger {
      background: var(--ant-danger);
      color: #fff;
    }

    /* SLA Overdue Pulsing */
    .pulse-effect {
      animation: badgePulsing 1.6s infinite ease-in-out;
    }

    @keyframes badgePulsing {
      0% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 77, 79, 0.7);
      }

      50% {
        transform: scale(1.08);
        box-shadow: 0 0 0 6px rgba(255, 77, 79, 0);
      }

      100% {
        transform: scale(1);
        box-shadow: 0 0 0 0 rgba(255, 77, 79, 0);
      }
    }

    /* Sider Footer */
    .sider-footer {
      border-top: 1px solid #f0f0f0;
      background: #fafafa;
      padding: 12px 14px;
      flex-shrink: 0;
    }

    .sider.collapsed .sider-footer {
      display: none;
    }

    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #fff;
      font-size: 13px;
      flex-shrink: 0;
    }

    .user-info {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .user-name {
      font-size: 12px;
      font-weight: 600;
      color: #1f2937;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-role-label {
      font-size: 10.5px;
      color: var(--sider-dark-text-secondary);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sim-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed #e8e8e8;
      padding-top: 8px;
    }

    .sim-text {
      font-size: 11px;
      color: var(--sider-dark-text-secondary);
    }

    .sim-btn-group {
      display: flex;
      gap: 4px;
    }

    .sim-btn {
      background: #ffffff;
      border: 1px solid #d9d9d9;
      color: #595959;
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 3px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .sim-btn:hover {
      background: var(--ant-primary);
      border-color: var(--ant-primary);
      color: #ffffff;
    }

    /* ==========================================================================
       MAIN CONTENT VIEWPORT
       ========================================================================== */
    .main-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: var(--layout-bg);
    }

    /* Topbar */
    .topbar {
      height: 64px;
      background: #ffffff;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 1px 4px rgba(0, 21, 41, 0.06);
      flex-shrink: 0;
      z-index: 10;
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .url-bar-simulator {
      display: flex;
      align-items: center;
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      padding: 4px 10px;
      gap: 8px;
      min-width: 360px;
    }

    .url-prefix {
      font-size: 11px;
      color: var(--text-secondary);
      font-weight: 600;
    }

    .url-input {
      border: none;
      background: transparent;
      font-family: monospace;
      font-size: 12.5px;
      color: var(--ant-primary);
      font-weight: 600;
      flex: 1;
      outline: none;
    }

    .url-go-btn {
      background: var(--ant-primary);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 3px 8px;
      font-size: 11px;
      cursor: pointer;
      font-weight: 600;
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .tag-offline {
      font-size: 11.5px;
      background: #f6ffed;
      border: 1px solid #b7eb8f;
      color: #389e0d;
      padding: 4px 10px;
      border-radius: 4px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .pulse-dot {
      width: 7px;
      height: 7px;
      background: #52c41a;
      border-radius: 50%;
      animation: pulseIndicator 1.8s infinite;
    }

    /* Content Body Area */
    .content-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    /* Breadcrumbs Bar */
    .breadcrumb-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 16px;
    }

    .breadcrumb-bar span.active {
      color: var(--ant-primary);
      font-weight: 600;
    }

    /* Viewport Cards */
    .view-card {
      background: #ffffff;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      padding: 24px;
      margin-bottom: 20px;
    }

    .view-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
      margin-bottom: 20px;
    }

    .view-title-group h2 {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-color);
    }

    .view-title-group p {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 4px;
    }

    /* 403 Forbidden Screen */
    .forbidden-box {
      text-align: center;
      padding: 40px 20px;
      max-width: 600px;
      margin: 0 auto;
    }

    .forbidden-icon {
      font-size: 54px;
      margin-bottom: 12px;
      animation: floatShield 2.5s infinite ease-in-out;
    }

    @keyframes floatShield {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .forbidden-title {
      font-size: 22px;
      font-weight: 700;
      color: var(--ant-danger);
      margin-bottom: 8px;
    }

    .forbidden-desc {
      font-size: 13.5px;
      color: var(--text-secondary);
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .audit-box {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      text-align: left;
      margin-bottom: 24px;
      font-size: 13px;
    }

    .audit-item {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px dashed var(--border-color);
    }

    .audit-item:last-child {
      border-bottom: none;
    }

    .audit-item .lbl {
      color: var(--text-secondary);
      font-weight: 500;
    }

    .audit-item .val {
      font-weight: 600;
      font-family: monospace;
    }

    .btn-return {
      background: var(--ant-primary);
      color: #fff;
      border: none;
      padding: 8px 20px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 13.5px;
    }

    .btn-return:hover {
      background: var(--ant-primary-hover);
    }

    /* Testing Matrix Box */
    .matrix-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    .matrix-card {
      background: #f8fafc;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
    }

    .matrix-card h4 {
      font-size: 14px;
      color: var(--text-color);
      margin-bottom: 8px;
    }

    .matrix-card p {
      font-size: 12.5px;
      color: var(--text-secondary);
      line-height: 1.4;
      margin-bottom: 12px;
    }

    .test-link-btn {
      display: inline-block;
      padding: 6px 12px;
      font-size: 12px;
      border-radius: 4px;
      background: #ffffff;
      border: 1px solid var(--border-color);
      color: var(--ant-primary);
      font-weight: 600;
      cursor: pointer;
      margin-right: 6px;
      margin-bottom: 6px;
      text-decoration: none;
      transition: all 0.2s;
    }

    .test-link-btn:hover {
      border-color: var(--ant-primary);
      background: var(--ant-primary-bg);
    }

    .test-link-btn.danger {
      color: var(--ant-danger);
    }

    .test-link-btn.danger:hover {
      border-color: var(--ant-danger);
      background: var(--ant-danger-bg);
    }

    .perm-chip {
      display: inline-block;
      background: #ffffff;
      border: 1px solid var(--border-color);
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-family: monospace;
      margin: 2px;
    }
  </style>
</head>

<body>

  <div class="app-layout">
    <!-- ========================================================================
       SIDEBAR NAVIGATION (DYNAMIC RBAC)
       ======================================================================== -->
    <aside class="sider" id="sider">
      <!-- Brand Header -->
      <div class="sider-header">
        <div class="brand-group">
          <div class="brand-icon">⚡</div>
          <div class="brand-text">
            <span class="brand-title">FLOW SYSTEM</span>
            <span class="brand-subtitle">IPCC 2.0 • RBAC</span>
          </div>
        </div>
        <button class="collapse-btn" id="collapseBtn" title="Thu gọn / Mở rộng Menu">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
            <path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z" />
          </svg>
        </button>
      </div>

      <!-- RBAC Switcher Toolbar -->
      <div class="rbac-toolbar">
        <div class="rbac-header-row">
          <span class="rbac-title">MÔ PHỎNG VAI TRÒ (RBAC):</span>
          <span class="role-badge" id="currentRoleBadge">ADMIN</span>
        </div>
        <div class="role-pills">
          <button class="role-pill active" onclick="switchUserRole('ADMIN')">Admin</button>
          <button class="role-pill" onclick="switchUserRole('SUPERVISOR')">Trưởng ca</button>
          <button class="role-pill" onclick="switchUserRole('AGENT')">Agent</button>
        </div>
        <div class="menu-search">
          <input type="text" id="menuSearchInput" placeholder="🔍 Tìm nhanh chức năng..."
            oninput="handleMenuSearch()" />
        </div>
      </div>

      <!-- Dynamic Menu Nav Tree -->
      <nav class="sider-nav">
        <ul class="menu-tree" id="menuTreeContainer">
          <!-- Rendered dynamically by JavaScript -->
        </ul>
      </nav>

      <!-- Footer Profile & Live Badges -->
      <div class="sider-footer">
        <div class="user-card">
          <div class="avatar" id="userAvatar" style="background: var(--ant-danger)">A</div>
          <div class="user-info">
            <span class="user-name" id="userName">Nguyễn Quản Trị</span>
            <span class="user-role-label" id="userRoleTitle">Super Admin Toàn quyền</span>
          </div>
        </div>
        <div class="sim-bar">
          <span class="sim-text">Giả lập Task M3:</span>
          <div class="sim-btn-group">
            <button class="sim-btn" onclick="alterTaskBadge(1)" title="Thêm 1 Task">+1</button>
            <button class="sim-btn" onclick="alterTaskBadge(-1)" title="Bớt 1 Task">-1</button>
          </div>
        </div>
      </div>
    </aside>

    <!-- ========================================================================
       MAIN APPLICATION VIEWPORT
       ======================================================================== -->
    <div class="main-wrapper">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <div class="url-bar-simulator">
            <span class="url-prefix">URL:</span>
            <input type="text" id="urlInput" class="url-input" value="/graph" />

  <!-- ==========================================================================
     STANDALONE JAVASCRIPT RBAC ENGINE (ZERO DEPENDENCY / OFFLINE)
     ========================================================================== -->
  <script>
    /**
     * 1. CẤU HÌNH MENU CỐ ĐỊNH CHUẨN HOÁ 9 PHÂN HỆ NGHIỆP VỤ (M1 - M7)

    const SYSTEM_MENU_CONFIG = [

      {

        requiredPermission: 'view',
        children: [
          { key: 'm7_organization', label: 'Cơ cấu tổ chức & Phòng ban (US-18)', path: '/admin/organization', requiredResource: 'SystemAdmin' },
          { key: 'm7_users_management', label: 'Quản lý danh sách Người dùng', path: '/admin/users', requiredResource: 'SystemAdmin' },

    ];

    /**
     * 2. DANH MỤC VAI TRÒ MẪU (PRESET USERS)
     */
    const PRESET_USERS = {
      ADMIN: {
        role: 'ADMIN',
        fullName: 'Nguyễn Quản Trị (Super Admin)',
        roleTitle: 'Quản trị viên Hệ thống Toàn quyền',
        avatarColor: '#f5222d',
        permissions: [
          { resource: 'Template', actions: ['view', 'create', 'edit', 'delete', 'execute'], scope: 'All' },
          { resource: 'ActionLibrary', actions: ['view', 'create', 'edit', 'delete', 'execute'], scope: 'All' },
          { resource: 'Instance', actions: ['view', 'create', 'edit', 'delete', 'execute'], scope: 'All' },
          { resource: 'Task', actions: ['view', 'create', 'edit', 'delete', 'execute'], scope: 'All' },
          { resource: 'Dashboard', actions: ['view', 'create', 'edit', 'delete', 'execute'], scope: 'All' },
          { resource: 'Report', actions: ['view', 'create', 'edit', 'delete', 'execute'], scope: 'All' },
          { resource: 'Integration', actions: ['view', 'create', 'edit', 'delete', 'execute'], scope: 'All' },
          { resource: 'MasterData', actions: ['view', 'create', 'edit', 'delete', 'execute'], scope: 'All' },
          { resource: 'SystemAdmin', actions: ['view', 'create', 'edit', 'delete', 'execute'], scope: 'All' }
        ]
      },
      SUPERVISOR: {
        role: 'SUPERVISOR',
        fullName: 'Trần Giám Sát (Trưởng ca IPCC)',
        roleTitle: 'Giám sát Vận hành & Chất lượng',
        avatarColor: '#fa8c16',
        permissions: [
          { resource: 'Template', actions: ['view', 'execute'], scope: 'Organization' },
          { resource: 'ActionLibrary', actions: ['view'], scope: 'Organization' },
          { resource: 'Instance', actions: ['view', 'execute'], scope: 'Organization' },
          { resource: 'Task', actions: ['view', 'edit', 'execute'], scope: 'Group' },
          { resource: 'Dashboard', actions: ['view'], scope: 'Organization' },
          { resource: 'Report', actions: ['view', 'create'], scope: 'Organization' },
          { resource: 'MasterData', actions: ['view'], scope: 'Organization' }
          // Lưu ý: Ẩn hoàn toàn M5 (Integration) và M7 (SystemAdmin)
        ]
      },
      AGENT: {
        role: 'AGENT',
        fullName: 'Lê Điện Thoại Viên (Agent FO/BO)',
        roleTitle: 'Chuyên viên Tiếp nhận Khách hàng',
        avatarColor: '#52c41a',
        permissions: [
          { resource: 'Task', actions: ['view', 'edit', 'execute'], scope: 'Own' },
          { resource: 'MasterData', actions: ['view'], scope: 'Own' }
          // Lưu ý: Chỉ xem M3 và M6. Ẩn hoàn toàn M1, M2, M4, M5, M7
        ]
      }
    };

    /**
     * 3. GLOBAL APP STATE
     */
    const AppState = {
      currentUser: PRESET_USERS.ADMIN,
      currentPath: '/graph',
      openGroups: ['m1_process_management'],
      collapsed: false,
      taskStats: { pending: 14, overdue: 3 },
      searchKeyword: ''
    };

    /**
     * 4. THUẬT TOÁN LỌC CÂY MENU ĐỆ QUY (RECURSIVE FILTER)
     */
    function hasPermission(userPerms, resource, action = 'view') {
      const item = userPerms.find(p => p.resource === resource);
      return item ? item.actions.includes(action) : false;
    }

    function filterMenuTree(tree, userPerms) {
      const result = [];
      for (const node of tree) {
        if (node.children && node.children.length > 0) {
          const allowedChildren = filterMenuTree(node.children, userPerms);
          if (allowedChildren.length > 0) {
            result.push({
              ...node,
              children: allowedChildren
            });
          }
        } else {
          const reqAction = node.requiredPermission || 'view';
          if (hasPermission(userPerms, node.requiredResource, reqAction)) {
            result.push({ ...node });
          }
        }
      }
      return result;
    }

    /**
     * 5. ROUTE GUARD (KIỂM TRA TRUY CẬP ĐƯỜNG DẪN)
     */
    function checkRouteAccess(targetPath) {
      let matched = null;
      function search(tree) {
        for (const item of tree) {
          if (item.path === targetPath) {
            matched = item;
            return;
          }
          if (item.children) search(item.children);
        }
      }
      search(SYSTEM_MENU_CONFIG);

      if (!matched) return { allowed: true };

      const reqAction = matched.requiredPermission || 'view';
      const ok = hasPermission(AppState.currentUser.permissions, matched.requiredResource, reqAction);

      if (!ok) {
        return {
          allowed: false,
          resource: matched.requiredResource,
          action: reqAction,
          title: matched.label
        };
      }
      return { allowed: true, title: matched.label };
    }

    /**
     * 6. RENDER MENU SIDEBAR
     */
    function renderSidebarMenu() {
      const container = document.getElementById('menuTreeContainer');
      container.innerHTML = '';

      const authorized = filterMenuTree(SYSTEM_MENU_CONFIG, AppState.currentUser.permissions);

      // Apply search
      const q = AppState.searchKeyword.toLowerCase().trim();
      const filtered = q ? authorized.filter(grp => {
        return grp.label.toLowerCase().includes(q) || (grp.children && grp.children.some(c => c.label.toLowerCase().includes(q)));
      }) : authorized;

      filtered.forEach(group => {
        const li = document.createElement('li');
        li.className = 'menu-group' + (AppState.openGroups.includes(group.key) ? ' open' : '');

        const hasActiveChild = group.children && group.children.some(c => c.path === AppState.currentPath);
        if (hasActiveChild) li.classList.add('has-active-child');

        // Group Header Row
        const header = document.createElement('div');
        header.className = 'group-header';
        header.onclick = () => toggleGroup(group.key);

        // Badges for M3 Group
        let badgeHtml = '';
        if (group.key === 'm3_task_management') {
          badgeHtml = `
        <div class="badge-cluster">
          <span class="badge-pill primary" title="14 Task chờ xử lý">${AppState.taskStats.pending}</span>
          ${AppState.taskStats.overdue > 0 ? `<span class="badge-pill danger pulse-effect" title="3 Task vượt SLA">${AppState.taskStats.overdue}</span>` : ''}
        </div>
      `;
        }

        header.innerHTML = `
      <span class="group-icon">${group.icon}</span>
      <span class="group-label">${group.label}</span>
      ${badgeHtml}
      <span class="arrow-icon">▼</span>
    `;

        // Children Sub-tree
        const ul = document.createElement('ul');
        ul.className = 'sub-tree';

        if (group.children) {
          group.children.forEach(child => {
            const childLi = document.createElement('li');
            childLi.className = 'leaf-item' + (child.path === AppState.currentPath ? ' selected' : '');
            childLi.onclick = (e) => {
              e.stopPropagation();
              navigateTo(child.path);
            };

            let childBadge = '';
            if (child.key === 'm3_my_tasks') {
              childBadge = `
            <div class="badge-cluster">
              <span class="badge-pill primary">${AppState.taskStats.pending}</span>
              ${AppState.taskStats.overdue > 0 ? `<span class="badge-pill danger pulse-effect">${AppState.taskStats.overdue}</span>` : ''}
            </div>
          `;
            }

            childLi.innerHTML = `
          <span class="leaf-bullet">•</span>
          <span class="leaf-text">${child.label}</span>
          ${childBadge}
        `;
            ul.appendChild(childLi);
          });
        }

        li.appendChild(header);
        li.appendChild(ul);
        container.appendChild(li);
      });
    }

    /**
     * 7. ĐIỀU HƯỚNG VÀ RENDER VIEW CHÍNH
     */
    function navigateTo(path) {
      AppState.currentPath = path;
      document.getElementById('urlInput').value = path;

      // Auto open parent group
      SYSTEM_MENU_CONFIG.forEach(grp => {
        if (grp.children && grp.children.some(c => c.path === path)) {
          if (!AppState.openGroups.includes(grp.key)) {
            AppState.openGroups.push(grp.key);
          }
        }
      });

      renderSidebarMenu();
      renderContentViewport(path);
    }

    function renderContentViewport(path) {
      const container = document.getElementById('viewContainer');
      const breadcrumbBar = document.getElementById('breadcrumbBar');
      const check = checkRouteAccess(path);

      if (!check.allowed) {
        // 403 Forbidden Screen
        breadcrumbBar.innerHTML = `
      <span>🏠 IPCC 2.0</span>
      <span>/</span>
      <span class="active">403 Forbidden</span>
    `;

        container.innerHTML = `
      <div class="view-card">
        <div class="forbidden-box">
          <div class="forbidden-icon">🛡️</div>
          <h2 class="forbidden-title">403 - Quyền Truy Cập Bị Từ Chối (Access Forbidden)</h2>
          <p class="forbidden-desc">
            Hệ thống Flow System (IPCC 2.0) đã ngăn chặn yêu cầu truy cập trực tiếp URL <strong>${path}</strong>.
            Tài khoản hiện tại của bạn không có quyền <code>view</code> trên tài nguyên tương ứng.
          </p>

          <div class="audit-box">
            <div class="audit-item">
              <span class="lbl">URL Cố tình truy cập:</span>
              <span class="val" style="color: var(--ant-danger);">${path}</span>
            </div>
            <div class="audit-item">
              <span class="lbl">Tài nguyên yêu cầu:</span>
              <span class="val">${check.resource}</span>
            </div>
            <div class="audit-item">
              <span class="lbl">Vai trò hiện tại:</span>
              <span class="val">${AppState.currentUser.role} (${AppState.currentUser.fullName})</span>
            </div>
            <div class="audit-item">
              <span class="lbl">Audit Log status:</span>
              <span class="val" style="color: var(--ant-success);">Đã ghi nhận vào FR-15 Immutable Logs</span>
            </div>
          </div>

          <button class="btn-return" onclick="navigateTo('${AppState.currentUser.role === 'AGENT' ? '/tasks/my-tasks' : '/graph'}')">
            ⬅ Quay lại trang được phép
          </button>
        </div>
      </div>
    `;
        return;
      }

      // Update Breadcrumb
      let crumbTitle = 'Trang nghiệp vụ';
      SYSTEM_MENU_CONFIG.forEach(grp => {
        if (grp.children) {
          grp.children.forEach(c => {
            if (c.path === path) {
              crumbTitle = `${grp.label} / ${c.label}`;
              breadcrumbBar.innerHTML = `
            <span>🏠 IPCC 2.0</span>
            <span>/</span>
            <span>${grp.label}</span>
            <span>/</span>
            <span class="active">${c.label}</span>
          `;
            }
          });
        }
      });

      // Render Module Content Card
      container.innerHTML = `
    <div class="view-card">
      <div class="view-header">
        <div class="view-title-group">
          <h2>${check.title || 'Phân hệ Chức năng IPCC 2.0'}</h2>
          <p>Đường dẫn hoạt động: <code>${path}</code> • Trạng thái: Sẵn sàng</p>
        </div>
        <span class="tag-offline">RBAC VIEW: GRANTED</span>
      </div>

      <div style="background: #e6f4ff; border: 1px solid #91caff; border-radius: 8px; padding: 16px; margin-bottom: 20px;">
        <h4 style="color: #0958d9; margin-bottom: 6px;">🛡️ Xác thực RBAC Thành Công</h4>
        <p style="font-size: 13px; color: #262626;">
          Bạn đang thao tác với vai trò <strong>${AppState.currentUser.role}</strong>. 
          Menu bên trái được dựng động dựa trên ma trận Function & Data Scope của người dùng.
        </p>
      </div>

      <!-- Test Actions Grid -->
      <div class="matrix-grid">
        <div class="matrix-card">
          <h4>🧪 1. Kiểm thử Route Guard Trái phép</h4>
          <p>Bấm thử các nút bên dưới để ép trình duyệt truy cập vào các module bị cấm tương ứng với vai trò hiện tại:</p>
          <button class="test-link-btn danger" onclick="navigateTo('/settings/sla-escalation')">
            🚨 Thử vào /settings/sla-escalation (M5)
          </button>
          <button class="test-link-btn danger" onclick="navigateTo('/admin/users')">
            🚨 Thử vào /admin/users (M7)
          </button>
          <button class="test-link-btn danger" onclick="navigateTo('/templates')">
            🚨 Thử vào /templates (M1)
          </button>
        </div>

        <div class="matrix-card">
          <h4>📋 2. Ma trận Quyền hạn Hiện tại</h4>
          <p>Danh sách các đối tượng Resource vai trò <strong>${AppState.currentUser.role}</strong> sở hữu:</p>
          <div style="max-height: 120px; overflow-y: auto;">
            ${AppState.currentUser.permissions.map(p => `
              <span class="perm-chip">${p.resource}: [${p.actions.join(', ')}] (${p.scope})</span>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  `;
    }

    /**
     * 8. EVENT HANDLERS
     */
    function switchUserRole(role) {
      AppState.currentUser = PRESET_USERS[role];

      // Update UI indicators
      document.getElementById('currentRoleBadge').textContent = role;
      document.getElementById('currentRoleBadge').className = `role-badge ${role}`;
      document.getElementById('userName').textContent = AppState.currentUser.fullName;
      document.getElementById('userRoleTitle').textContent = AppState.currentUser.roleTitle;
      document.getElementById('userAvatar').textContent = role.charAt(0);
      document.getElementById('userAvatar').style.background = AppState.currentUser.avatarColor;

      // Update pills
      document.querySelectorAll('.role-pill').forEach(btn => {
        btn.classList.toggle('active', btn.textContent.toUpperCase().includes(role) || (role === 'AGENT' && btn.textContent.includes('Agent')) || (role === 'SUPERVISOR' && btn.textContent.includes('Trưởng ca')));
      });

      // Verify if current path is allowed, if not redirect to default
      const check = checkRouteAccess(AppState.currentPath);
      if (!check.allowed) {
        if (role === 'AGENT') {
          navigateTo('/tasks/my-tasks');
        } else {
          navigateTo('/graph');
        }
      } else {
        renderSidebarMenu();
        renderContentViewport(AppState.currentPath);
      }
    }

    function toggleGroup(key) {
      if (AppState.collapsed) {
        AppState.collapsed = false;
        document.getElementById('sider').classList.remove('collapsed');
      }
      const idx = AppState.openGroups.indexOf(key);
      if (idx > -1) {
        AppState.openGroups.splice(idx, 1);
      } else {
        AppState.openGroups.push(key);
      }
      renderSidebarMenu();
    }

    function handleMenuSearch() {
      AppState.searchKeyword = document.getElementById('menuSearchInput').value;
      renderSidebarMenu();
    }

    function handleDirectUrlEnter() {
      const url = document.getElementById('urlInput').value.trim();
      if (url) {
        navigateTo(url);
      }
    }

    function alterTaskBadge(delta) {
      AppState.taskStats.pending = Math.max(0, AppState.taskStats.pending + delta);
      AppState.taskStats.overdue = Math.max(0, Math.min(AppState.taskStats.pending, AppState.taskStats.overdue + (delta > 0 ? 1 : -1)));
      renderSidebarMenu();
      renderContentViewport(AppState.currentPath);
    }

    // Sidebar Collapse toggle
    document.getElementById('collapseBtn').onclick = () => {
      AppState.collapsed = !AppState.collapsed;
      document.getElementById('sider').classList.toggle('collapsed', AppState.collapsed);
    };

    // Listen to Enter on URL simulator
    document.getElementById('urlInput').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleDirectUrlEnter();
    });

    // Initialize on Load
    window.onload = () => {
      navigateTo('/graph');
    };
  </script>
