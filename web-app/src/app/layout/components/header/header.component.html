<header class="topbar-header">
  <div class="topbar-left">
    <div class="engine-indicator">
      <span class="pulse-dot"></span>
      <span class="engine-title">IPCC 2.0</span>
    </div>

    <div class="topbar-divider"></div>

    <!-- Dynamic Router Breadcrumb Trail -->
    <nav class="breadcrumb-container" aria-label="breadcrumb">
      <span class="breadcrumb-item home-item">
        <span class="crumb-icon">
          <ant-icon name="apartment" [size]="14"></ant-icon>
        </span>
        <span class="crumb-text">Flow System</span>
        <span class="crumb-separator">/</span>
      </span>
      <ng-container *ngFor="let crumb of (rbacService.breadcrumbs$ | async); let last = last">
        <span class="breadcrumb-item" [class.last-item]="last">
          <span class="crumb-text" [class.current]="last">{{ crumb }}</span>
          <span class="crumb-separator" *ngIf="!last">/</span>
        </span>
      </ng-container>
    </nav>
  </div>

  <div class="topbar-right" *ngIf="currentUser">
    <!-- Lối tắt tới trang dev UI Kit (danh mục component dùng chung) -->
    <a class="pin-default-btn ui-kit-btn"
       routerLink="/ui-kit"
       routerLinkActive="is-active"
       title="Xem danh mục component dùng chung (UI Kit)">
      <span class="pin-icon">
        <ant-icon name="appstore" [size]="14"></ant-icon>
      </span>
      <span class="pin-text">UI Kit</span>
    </a>

    <!-- Nút Đặt làm trang mặc định (US-08, US-09) -->
    <button class="pin-default-btn" 
            [class.is-default]="isCurrentPageDefault"
            (click)="toggleSetCurrentPageDefault()"
            [title]="isCurrentPageDefault ? 'Trang này đang là màn hình mặc định khi bạn đăng nhập (Bấm để hủy)' : 'Đặt trang này làm màn hình mặc định khi bạn đăng nhập (US-08, US-09)'">
      <span class="pin-icon">
        <ant-icon [name]="isCurrentPageDefault ? 'star-fill' : 'star'" [size]="14" [color]="isCurrentPageDefault ? '#faad14' : 'inherit'"></ant-icon>
      </span>
      <span class="pin-text">{{ isCurrentPageDefault ? 'Trang mặc định' : 'Đặt làm mặc định' }}</span>
    </button>

    <div class="topbar-divider"></div>

    <div class="user-chip">
      <div class="avatar" [attr.data-role]="currentUser.role">
        {{ currentUser.role.charAt(0) }}
      </div>
      <div class="user-info">
        <span class="name">{{ currentUser.fullName }}</span>
        <span class="role-desc">{{ currentUser.roleTitle }}</span>
      </div>
    </div>
  </div>
</header>
