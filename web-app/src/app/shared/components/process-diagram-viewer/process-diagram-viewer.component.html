<div class="process-diagram-viewer" [style.height]="height">
  <!-- Nút Căn vừa (Fit View) -->
  <button *ngIf="showFitButton" type="button" class="btn-fit-view" (click)="zoomToFit()" title="Căn vừa sơ đồ">
    <svg class="fit-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path>
    </svg>
    <span>Căn vừa</span>
  </button>

  <!-- Vùng chứa X6 Graph Canvas -->
  <div #container class="x6-graph-container"></div>

  <!-- Legend chú thích trạng thái thực thi của sơ đồ -->
  <div *ngIf="showLegend" class="diagram-legend">
    <div class="legend-item legend-completed">
      <span class="legend-marker marker-box completed"></span>
      <span class="legend-text">Đã thực thi</span>
    </div>
    <div class="legend-item legend-active">
      <span class="legend-marker marker-box active"></span>
      <span class="legend-text">Đang xử lý</span>
    </div>
    <div class="legend-item legend-overdue">
      <span class="legend-marker marker-box overdue"></span>
      <span class="legend-text">Quá hạn</span>
    </div>
    <div class="legend-item legend-skipped">
      <span class="legend-marker marker-box skipped"></span>
      <span class="legend-text">Nhánh không đi qua</span>
    </div>
    <div class="legend-item legend-pending">
      <span class="legend-marker marker-box pending"></span>
      <span class="legend-text">Chưa tới</span>
    </div>
    <div class="legend-item legend-traversed">
      <span class="legend-marker marker-line traversed"></span>
      <span class="legend-text">Luồng đã đi</span>
    </div>
  </div>
</div>
