<!-- Badge nền đặc -->
<span
  *ngIf="appearance === 'fill'; else outlineTag"
  class="px-badge"
  [attr.data-status]="normalizedStatus">{{ text || label }}</span>

<ng-template #outlineTag>
  <span
    class="ant-tag"
    [class.ant-tag-sm]="size === 'small'"
    [attr.data-status]="normalizedStatus">
    <span class="ant-tag-dot" *ngIf="dot"></span>
    <span class="ant-tag-text">{{ text || label }}</span>
  </span>
</ng-template>
