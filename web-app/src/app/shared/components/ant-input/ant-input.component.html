<div 
  class="ant-input-affix-wrapper"
  [class.ant-input-affix-wrapper-focused]="isFocused"
  [class.ant-input-affix-wrapper-disabled]="disabled"
  [class.ant-input-affix-wrapper-status-error]="status === 'error'"
  [class.ant-input-affix-wrapper-status-warning]="status === 'warning'"
  [class.ant-input-affix-wrapper-sm]="size === 'small'"
  [class.ant-input-affix-wrapper-lg]="size === 'large'">
  
  <span class="ant-input-prefix" *ngIf="prefixIcon">
    <ant-icon [name]="prefixIcon" [size]="14"></ant-icon>
  </span>

  <input
    #inputElement
    [type]="type"
    class="ant-input"
    [placeholder]="placeholder"
    [disabled]="disabled"
    [readonly]="readonly"
    [attr.maxlength]="maxLength || null"
    [value]="value"
    (input)="onInput($event)"
    (focus)="onFocus()"
    (blur)="onBlur()"
    (keydown.enter)="onEnter.emit(value)" />

  <span 
    class="ant-input-clear-icon" 
    *ngIf="allowClear && value && !disabled && !readonly"
    (click)="clearValue($event)"
    title="Xóa nội dung">
    <ant-icon name="close-circle-fill" [size]="12"></ant-icon>
  </span>

  <span class="ant-input-suffix" *ngIf="suffixIcon && (!allowClear || !value)">
    <ant-icon [name]="suffixIcon" [size]="14"></ant-icon>
  </span>

  <span class="ant-input-show-count" *ngIf="showCount && maxLength">
    {{ (value || '').length }} / {{ maxLength }}
  </span>
</div>
