<div
    class="service-owner-box"
    nz-dropdown
    nzTrigger="click"
    nzPlacement="bottomRight"
    [nzDropdownMenu]="serviceOwnerMenu"
    [(nzVisible)]="isGroupDropdownOpen"
    title="Chuyển đơn vị dịch vụ"
>
    <span class="service-owner-name">{{ selectedGroupName || 'Chọn đơn vị dịch vụ' }}</span>
    <svg
        class="chevron-icon"
        [class.rotated]="isGroupDropdownOpen"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
    >
        <polyline points="6 9 12 15 18 9"></polyline>
    </svg>
</div>

<!-- Dropdown Menu for Service Owner -->
<nz-dropdown-menu #serviceOwnerMenu="nzDropdownMenu">
    <div class="service-owner-dropdown-card">
        <div class="service-owner-dropdown-header">
            Chuyển đơn vị dịch vụ
        </div>
        <ul class="service-owner-list">
            <li
                *ngFor="let group of serviceOwnerList"
                class="service-owner-item"
                [class.active]="group.id === selectedGroupId || group.name === selectedGroupName"
                (click)="onSelectServiceOwner(group)"
            >
                <span class="check-placeholder">
                    <svg
                        *ngIf="group.id === selectedGroupId || group.name === selectedGroupName"
                        class="check-icon"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2.5"
                    >
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </span>
                <span class="group-name">{{ group.name }}</span>
            </li>
        </ul>
    </div>
</nz-dropdown-menu>
