<aside class="sidebar-container" [class.collapsed]="collapsed">
    <!-- Brand Header with Toggle Button on top of ProcessX -->
    <div class="sidebar-header">
        <div class="brand-box" (click)="onToggle()" title="Thu gọn / Mở rộng menu">
            <!-- Toggle Hamburger Button -->
            <button type="button" class="header-toggle-btn" (click)="$event.stopPropagation(); onToggle()" title="Đóng / Mở menu">
                <svg class="toggle-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="3" y1="6" x2="21" y2="6"></line>
                    <line x1="3" y1="12" x2="21" y2="12"></line>
                    <line x1="3" y1="18" x2="21" y2="18"></line>
                </svg>
            </button>

            <!-- Workflow ProcessX Brand Logo & Name -->
            <div class="brand-title-wrap" *ngIf="!collapsed">
                <svg class="brand-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="6" y1="3" x2="6" y2="15"></line>
                    <circle cx="18" cy="6" r="3"></circle>
                    <circle cx="6" cy="18" r="3"></circle>
                    <path d="M18 9a9 9 0 0 1-9 9"></path>
                </svg>
                <span class="brand-name">ProcessX</span>
            </div>
        </div>

        <!-- Dropdown Chevron -->
        <div class="header-action" *ngIf="!collapsed" (click)="onToggle()">
            <svg class="chevron-down" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
        </div>
    </div>

    <!-- Navigation Menu List -->
    <nav class="sidebar-nav">
        <ul class="menu-list">
            <li
                    *ngFor="let item of menuItems"
                    class="menu-item"
                    [class.active]="selectedId === item.id"
                    (click)="selectMenu(item)"
                    [title]="item.label"
            >
                <span class="item-icon" [innerHTML]="item.iconSvg"></span>
                <span class="item-label" *ngIf="!collapsed">{{ item.label }}</span>
            </li>
        </ul>
    </nav>
</aside>
