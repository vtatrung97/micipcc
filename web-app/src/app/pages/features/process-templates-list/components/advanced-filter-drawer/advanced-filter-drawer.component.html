<app-drawer [visible]="visible" title="Bộ lọc nâng cao" (closed)="cancel()">
  <app-form-field label="Tên quy trình" [spacing]="0">
    <ant-input [(ngModel)]="draft.name" [maxLength]="maxLength" placeholder="Nhập tại đây"></ant-input>
  </app-form-field>

  <app-form-field label="Mã quy trình" [spacing]="0">
    <ant-input [(ngModel)]="draft.code" [maxLength]="maxLength" placeholder="Nhập tại đây"></ant-input>
  </app-form-field>

  <app-form-field label="Nhóm quy trình" [spacing]="0">
    <ant-select [(ngModel)]="draft.category" [options]="options.categories"
                placeholder="Chọn tại đây" [allowClear]="true"></ant-select>
  </app-form-field>

  <app-form-field label="Trạng thái" [spacing]="0">
    <ant-select [(ngModel)]="draft.status" [options]="statusOptions"
                placeholder="Chọn tại đây" [allowClear]="true"></ant-select>
  </app-form-field>

  <app-form-field label="Loại kích hoạt" [spacing]="0">
    <ant-select [(ngModel)]="draft.triggerType" [options]="options.triggers"
                placeholder="Chọn tại đây" [allowClear]="true"></ant-select>
  </app-form-field>

  <app-form-field label="Người tạo" [spacing]="0">
    <ant-select [(ngModel)]="draft.createdBy" [options]="options.creators" [showSearch]="true"
                placeholder="Chọn tại đây" [allowClear]="true"></ant-select>
  </app-form-field>

  <app-form-field label="Ngày tạo" [spacing]="0">
    <app-date-picker [isRange]="true" [fixedPanel]="true" [maxDate]="today" [allowOpenRange]="true" [(ngModel)]="draft.createdRange"
                     placeholder="dd/mm/yyyy-dd/mm/yyyy"></app-date-picker>
  </app-form-field>

  <app-form-field label="Người cập nhật" [spacing]="0">
    <ant-select [(ngModel)]="draft.updatedBy" [options]="options.updaters" [showSearch]="true"
                placeholder="Chọn tại đây" [allowClear]="true"></ant-select>
  </app-form-field>

  <app-form-field label="Ngày cập nhật" [spacing]="0">
    <app-date-picker [isRange]="true" [fixedPanel]="true" [maxDate]="today" [allowOpenRange]="true" [(ngModel)]="draft.updatedRange"
                     placeholder="dd/mm/yyyy-dd/mm/yyyy"></app-date-picker>
  </app-form-field>

  <app-form-field label="Ngày ban hành" [spacing]="0">
    <app-date-picker [isRange]="true" [fixedPanel]="true" [maxDate]="today" [allowOpenRange]="true" [(ngModel)]="draft.publishedRange"
                     placeholder="dd/mm/yyyy-dd/mm/yyyy"></app-date-picker>
  </app-form-field>

  <div drawer-footer class="filter-actions">
    <button type="button" class="px-btn px-btn-outline-primary" (click)="reset()">Đặt lại</button>
    <div class="filter-actions-right">
      <button type="button" class="px-btn px-btn-default" (click)="cancel()">Hủy</button>
      <button type="button" class="px-btn px-btn-primary" (click)="submit()">Áp dụng</button>
    </div>
  </div>
</app-drawer>
