<app-drawer [visible]="visible" title="Bộ lọc nâng cao" (closed)="cancel()">
  <app-form-field label="Tên quy trình" [spacing]="0">
    <ant-input [(ngModel)]="draft.name" placeholder="Nhập tại đây"></ant-input>
  </app-form-field>

  <app-form-field label="Mã quy trình" [spacing]="0">
    <ant-input [(ngModel)]="draft.code" placeholder="Nhập tại đây"></ant-input>
  </app-form-field>

  <app-form-field label="Phiên bản hiệu lực" [spacing]="0">
    <ant-select [(ngModel)]="draft.version" [options]="versionOptions"
                placeholder="Chọn tại đây" [allowClear]="true"></ant-select>
  </app-form-field>

  <app-form-field label="Trạng thái" [spacing]="0">
    <app-quick-filter [(ngModel)]="draft.status" [options]="statusOptions"></app-quick-filter>
  </app-form-field>

  <app-form-field label="Bản nháp" [spacing]="0">
    <app-quick-filter [(ngModel)]="draft.draft" [options]="draftOptions"></app-quick-filter>
  </app-form-field>

  <app-form-field label="Tình trạng vận hành" [spacing]="0">
    <app-quick-filter [(ngModel)]="draft.operation" [options]="operationOptions"></app-quick-filter>
  </app-form-field>

  <app-form-field label="Cập nhật lần cuối" [spacing]="0">
    <app-date-picker [(ngModel)]="draft.updatedDate"></app-date-picker>
  </app-form-field>

  <app-form-field label="Ngày ban hành" [spacing]="0">
    <app-date-picker [(ngModel)]="draft.publishedDate"></app-date-picker>
  </app-form-field>

  <div drawer-footer class="filter-actions">
    <button type="button" class="px-btn px-btn-outline-primary" (click)="reset()">Đặt lại</button>
    <div class="filter-actions-right">
      <button type="button" class="px-btn px-btn-default" (click)="cancel()">Hủy</button>
      <button type="button" class="px-btn px-btn-primary" (click)="submit()">Áp dụng</button>
    </div>
  </div>
</app-drawer>
