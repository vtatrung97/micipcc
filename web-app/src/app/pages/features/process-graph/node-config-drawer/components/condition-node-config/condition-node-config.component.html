<div class="condition-config-container" *ngIf="nodeProps">
  <div class="drawer-section-heading mt-4">
    <ant-icon name="branches" [size]="14" style="margin-right: 6px;"></ant-icon>
    <span>ĐỊNH TUYẾN & RẼ NHÁNH LOGIC</span>
  </div>

  <!-- Nguồn -->
  <nz-form-item>
    <nz-form-label nzRequired>Nguồn</nz-form-label>
    <nz-form-control>
      <nz-select [(ngModel)]="nodeProps.servicePivotSource" (ngModelChange)="onPropChange('servicePivotSource')"
        name="servicePivotSource">
        <nz-option nzValue="flow.variables" nzLabel="flow.variables (Biến tiến trình)"></nz-option>
        <nz-option nzValue="ipcc.response" nzLabel="ipcc.response (Dữ liệu IPCC 2.0)"></nz-option>
        <nz-option nzValue="billing.cdr" nzLabel="billing.cdr (Cước viễn thông)"></nz-option>
        <nz-option nzValue="crm.ticket" nzLabel="crm.ticket (CRM Siebel)"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <!-- Biến rẽ nhánh -->
  <nz-form-item>
    <nz-form-label nzRequired>Biến rẽ nhánh</nz-form-label>
    <nz-form-control>
      <input nz-input class="font-mono text-xs" [(ngModel)]="nodeProps.conditionVariable"
        (ngModelChange)="onPropChange('conditionVariable')" name="conditionVariable"
        placeholder="Nhập tên biến (VD: flow.variables.cuoc)" />
    </nz-form-control>
  </nz-form-item>

  <!-- Danh sách nhánh rẽ -->
  <div class="branch-dynamic-header mb-2">
    <div class="branch-heading-wrap">
      <span class="branch-section-heading">Danh sách nhánh</span>
      <span class="required">*</span>
    </div>
    <button type="button" class="btn-link-add-branch" (click)="addBranch()">
      <span>+ Thêm nhánh</span>
    </button>
  </div>

  <!-- Bảng nhánh rẽ -->
  <div class="branch-table-container mb-3">
    <div class="branch-table-header">
      <div class="col-table-val">Điều kiện <span class="required">*</span></div>
      <div class="col-table-desc">Mô tả</div>
      <div class="col-table-act">Thao tác</div>
    </div>

    <div class="branch-table-body">
      <!-- Cổng mặc định -->
      <div class="branch-table-row default-branch-row" *ngIf="nodeProps.branches?.[0] as defBr">
        <div class="col-table-val">
          <span class="badge-default-val">Mặc định</span>
        </div>
        <div class="col-table-desc">
          <input type="text" class="form-input branch-cell-input" [(ngModel)]="defBr.name"
            (ngModelChange)="onBranchChange(0)" name="branchDesc_0" placeholder="Mặc định" />
        </div>
        <div class="col-table-act">
          <span class="lock-icon" title="Cổng Mặc định cố định">
            <ant-icon name="lock" [size]="13" color="#94a3b8"></ant-icon>
          </span>
        </div>
      </div>

      <!-- Các nhánh tùy biến -->
      <ng-container *ngFor="let br of nodeProps.branches; let idx = index">
        <div class="branch-table-row" *ngIf="!br.isDefault">
          <div class="col-table-val">
            <input type="text" class="form-input branch-cell-input font-mono text-xs" [(ngModel)]="br.value"
              (ngModelChange)="onBranchChange(idx)" name="branchVal_{{idx}}" placeholder="Nhập giá trị" />
          </div>
          <div class="col-table-desc">
            <input type="text" class="form-input branch-cell-input" [(ngModel)]="br.name"
              (ngModelChange)="onBranchChange(idx)" name="branchDesc_{{idx}}"
              [placeholder]="br.defaultLabel || ('Nhánh ' + idx)" />
          </div>
          <div class="col-table-act">
            <button type="button" class="btn-table-trash" (click)="removeBranch(idx)" title="Xoá nhánh này">
              <ant-icon name="delete" [size]="13"></ant-icon>
            </button>
          </div>
        </div>
      </ng-container>

      <div class="branch-empty-hint" *ngIf="(nodeProps.branches?.length || 0) <= 1">
        Bấm <strong>+ Thêm nhánh</strong> để bổ sung các cổng rẽ nhánh logic.
      </div>
    </div>
  </div>
</div>
