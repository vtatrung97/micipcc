<div class="cond-config" *ngIf="nodeProps">
  <!-- ===== Thông tin chung ===== -->
  <section class="cond-section">
    <ng-container *ngTemplateOutlet="sectionHead; context: { key: 'general', title: 'PROCESS_GRAPH.DRAWER.SECTIONS.GENERAL' }"></ng-container>
    <ng-container *ngIf="isOpen('general')">
      <app-form-field [label]="'PROCESS_GRAPH.DRAWER.FIELDS.STEP_NAME' | translate" [error]="errors.label ? ('PROCESS_GRAPH.DRAWER.VALIDATION.REQUIRED' | translate) : ''" [required]="true" [spacing]="0">
        <ant-input [ngModel]="nodeProps.label" (ngModelChange)="onLabelChange($event)" [maxLength]="limits.label"
                   [placeholder]="'PROCESS_GRAPH.COMMON.INPUT_PLACEHOLDER' | translate"></ant-input>
      </app-form-field>

      <!-- Mã bước: tự sinh từ tên bước, cho sửa (chữ, số, "_") -->
      <app-form-field [label]="'PROCESS_GRAPH.DRAWER.FIELDS.STEP_CODE' | translate" [required]="true" [spacing]="0"
                      [error]="errors.nodeKey ? (('PROCESS_GRAPH.DRAWER.VALIDATION.' + (errors.nodeKey === true ? 'REQUIRED' : errors.nodeKey)) | translate) : ''">
        <ant-input class="step-code" [(ngModel)]="nodeProps.nodeKey" (ngModelChange)="save('nodeKey')"
                   [inputFilter]="nodeKeyFilter" [maxLength]="limits.nodeKey"
                   [placeholder]="'PROCESS_GRAPH.COMMON.INPUT_PLACEHOLDER' | translate"></ant-input>
      </app-form-field>

      <app-form-field [label]="'PROCESS_GRAPH.DRAWER.FIELDS.DESCRIPTION' | translate" [spacing]="0">
        <ant-textarea [(ngModel)]="nodeProps.description" (ngModelChange)="save('description')" [maxLength]="limits.description"
                      [placeholder]="'PROCESS_GRAPH.COMMON.INPUT_PLACEHOLDER' | translate"></ant-textarea>
      </app-form-field>
    </ng-container>
  </section>

  <div class="cond-divider"></div>

  <!-- ===== Danh sách nhánh: Tên nhánh · Điều kiện (số điều kiện) · Hành động ===== -->
  <section class="cond-section">
    <ng-container *ngTemplateOutlet="sectionHead; context: { key: 'branches', title: 'PROCESS_GRAPH.DRAWER.CONDITION.BRANCHES_TITLE' }"></ng-container>
    <div class="branch-table" *ngIf="isOpen('branches')">
      <div class="branch-scroll">
        <table>
          <thead>
            <tr>
              <th class="col-name">{{ 'PROCESS_GRAPH.DRAWER.CONDITION.COL_BRANCH' | translate }}</th>
              <th>{{ 'PROCESS_GRAPH.DRAWER.CONDITION.COL_CONDITIONS' | translate }}</th>
              <th class="col-action">{{ 'PROCESS_GRAPH.DRAWER.CONDITION.COL_ACTIONS' | translate }}</th>
            </tr>
          </thead>
          <tbody>
            <tr *ngFor="let branch of branches; trackBy: trackById">
              <td class="col-name">
                <span class="cell-text" [appTooltip]="branchName(branch)" [tooltipOnlyTruncated]="true">{{ branchName(branch) }}</span>
              </td>
              <td><span class="cell-text">{{ isFixed(branch) ? '' : (branch.rules?.length || 0) }}</span></td>
              <td class="col-action">
                <!-- Mặc định, Lỗi là nhánh cố định: không xem / sửa / xoá -->
                <div class="row-actions" *ngIf="!isFixed(branch)">
                  <button type="button" class="row-btn" (click)="openModal('view', branch)"
                          [appTooltip]="'PROCESS_GRAPH.DRAWER.CONDITION.VIEW' | translate">
                    <img src="assets/icons/processx/eye.svg" width="20" height="20" alt="" />
                  </button>
                  <button type="button" class="row-btn" (click)="openModal('edit', branch)"
                          [appTooltip]="'PROCESS_GRAPH.DRAWER.CONDITION.EDIT' | translate">
                    <img src="assets/icons/processx/edit.svg" width="20" height="20" alt="" />
                  </button>
                  <button type="button" class="row-btn" (click)="removeBranch(branch)"
                          [appTooltip]="'PROCESS_GRAPH.DRAWER.CONDITION.DELETE' | translate">
                    <img src="assets/icons/processx/trash-danger.svg" width="20" height="20" alt="" />
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
      <div class="branch-add">
        <button type="button" class="branch-add-btn" (click)="openModal('create')">
          <img src="assets/icons/processx/plus-blue.svg" width="24" height="24" alt="" />
          <span>{{ 'PROCESS_GRAPH.DRAWER.CONDITION.ADD_BRANCH' | translate }}</span>
        </button>
      </div>
    </div>
  </section>
</div>

<app-branch-condition-modal
  [visible]="!!modalMode"
  [nodeId]="nodeProps.id"
  [mode]="modalMode || 'create'"
  [branch]="editingBranch"
  [otherNames]="otherNames"
  [suggestedName]="suggestedName"
  (saved)="onModalSaved($event)"
  (closed)="closeModal()">
</app-branch-condition-modal>

<!-- Tiêu đề khối + chevron thu gọn -->
<ng-template #sectionHead let-key="key" let-title="title">
  <button type="button" class="section-head" (click)="toggleSection(key)" [attr.aria-expanded]="isOpen(key)">
    <span>{{ title | translate }}</span>
    <img class="section-chevron" [class.collapsed]="!isOpen(key)"
         src="assets/icons/processx/chevron-up.svg" width="24" height="24" alt="" />
  </button>
</ng-template>
