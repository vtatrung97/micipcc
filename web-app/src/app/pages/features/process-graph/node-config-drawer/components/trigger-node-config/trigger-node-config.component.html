<div class="trigger-config-container" *ngIf="nodeProps">
  <div class="drawer-section-heading mt-4">
    <ant-icon name="thunderbolt" [size]="14" style="margin-right: 6px;"></ant-icon>
    <span>SỰ KIỆN KÍCH HOẠT (TRIGGER EVENT)</span>
  </div>

  <!-- Loại sự kiện Trigger -->
  <nz-form-item>
    <nz-form-label nzRequired>Sự kiện kích hoạt</nz-form-label>
    <nz-form-control>
      <nz-select [(ngModel)]="nodeProps.triggerEvent" (ngModelChange)="onPropChange('triggerEvent')"
        name="triggerEvent">
        <nz-option nzValue="Inbound Call (Tổng đài 1800xxxx)" nzLabel="Inbound Call (Tổng đài 1800xxxx)"></nz-option>
        <nz-option nzValue="CRM Ticket Created (Ticket mới từ CRM)" nzLabel="CRM Ticket Created (Ticket mới từ CRM)"></nz-option>
        <nz-option nzValue="Webhook Event (API bên thứ 3)" nzLabel="Webhook Event (API bên thứ 3)"></nz-option>
        <nz-option nzValue="Schedule Cron (Định kỳ tự động)" nzLabel="Schedule Cron (Định kỳ tự động)"></nz-option>
        <nz-option nzValue="Manual Trigger (Khởi tạo thủ công bởi Agent)" nzLabel="Manual Trigger (Khởi tạo thủ công bởi Agent)"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <!-- Gán quyền phụ trách (Assignee) -->
  <nz-form-item>
    <nz-form-label>Đối tượng xử lý ban đầu</nz-form-label>
    <nz-form-control>
      <nz-select [(ngModel)]="nodeProps.assignee" (ngModelChange)="onPropChange('assignee')"
        name="stepAssignee">
        <nz-option nzValue="Hệ thống tự động (System)" nzLabel="Hệ thống tự động (System)"></nz-option>
        <nz-option nzValue="Điện thoại viên (FO/BO)" nzLabel="Điện thoại viên (FO/BO)"></nz-option>
        <nz-option nzValue="Tổ Tiếp nhận Khách hàng VIP" nzLabel="Tổ Tiếp nhận Khách hàng VIP"></nz-option>
        <nz-option nzValue="Trưởng ca (Supervisor)" nzLabel="Trưởng ca (Supervisor)"></nz-option>
      </nz-select>
    </nz-form-control>
  </nz-form-item>

  <!-- Cam kết thời hạn SLA -->
  <div class="form-row-2">
    <nz-form-item>
      <nz-form-label>Cam kết SLA</nz-form-label>
      <nz-form-control>
        <nz-select [(ngModel)]="nodeProps.sla" (ngModelChange)="onPropChange('sla')" name="stepSla">
          <nz-option nzValue="15m SLA" nzLabel="15m SLA (Khẩn cấp)"></nz-option>
          <nz-option nzValue="30m SLA" nzLabel="30m SLA"></nz-option>
          <nz-option nzValue="1h SLA" nzLabel="1h SLA"></nz-option>
          <nz-option nzValue="2h SLA" nzLabel="2h SLA (Tiêu chuẩn)"></nz-option>
          <nz-option nzValue="24h SLA" nzLabel="24h SLA"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-label>Cảnh báo Timeout</nz-form-label>
      <nz-form-control>
        <nz-select [(ngModel)]="nodeProps.timeout" (ngModelChange)="onPropChange('timeout')" name="stepTimeout">
          <nz-option nzValue="5 phút" nzLabel="5 phút (Cảnh báo vàng)"></nz-option>
          <nz-option nzValue="15 phút" nzLabel="15 phút"></nz-option>
          <nz-option nzValue="30 phút" nzLabel="30 phút"></nz-option>
          <nz-option nzValue="1 giờ" nzLabel="1 giờ"></nz-option>
          <nz-option nzValue="Không giới hạn" nzLabel="Không giới hạn"></nz-option>
        </nz-select>
      </nz-form-control>
    </nz-form-item>
  </div>

  <!-- Ghi chú mô tả -->
  <nz-form-item>
    <nz-form-label>Mô tả nguồn kích hoạt</nz-form-label>
    <nz-form-control>
      <textarea nz-input rows="3" [(ngModel)]="nodeProps.description"
        (ngModelChange)="onPropChange('description')" name="stepDesc"
        placeholder="Ghi chú điều kiện hoặc nguồn phát sinh sự kiện...">
      </textarea>
    </nz-form-control>
  </nz-form-item>
</div>
