<div class="json-preview-container">
  <!-- Thanh công cụ chuyển đổi chế độ xem & Thống kê -->
  <div class="json-preview-toolbar">
    <div class="view-switch-tabs">
      <button type="button" class="view-tab-btn" [class.active]="activeView === 'full'" (click)="setView('full')">
        📁 Toàn bộ file Map (Full Payload)
      </button>
      <button type="button" class="view-tab-btn" [class.active]="activeView === 'execution'" (click)="setView('execution')">
        ⚡ Đồ thị thực thi (executionGraph)
      </button>
      <button type="button" class="view-tab-btn" [class.active]="activeView === 'graph'" (click)="setView('graph')">
        🎨 Raw Canvas (graphData)
      </button>
    </div>

    <div class="toolbar-stats" *ngIf="parsedData?.executionGraph">
      <span class="stat-badge">🔢 {{ parsedData.executionGraph.totalNodes || 0 }} Nodes</span>
      <span class="stat-badge">🔗 {{ parsedData.executionGraph.totalTransitions || 0 }} Transitions</span>
    </div>
  </div>

  <!-- Vùng hiển thị JSON Code -->
  <div class="json-preview-body">
    <pre class="json-code-box"><code>{{ currentDisplayJson }}</code></pre>
  </div>

  <!-- Nút tương tác chân modal: Tải về, Sao chép, Đóng -->
  <div class="json-preview-footer">
    <button nz-button nzType="default" (click)="downloadJson()" title="Tải xuống tệp JSON về máy tính">
      <span style="margin-right: 5px;">💾</span>
      <span>Tải file .json</span>
    </button>
    <button nz-button nzType="default" (click)="copyJson()" title="Sao chép toàn bộ JSON vào bộ nhớ đệm">
      <span style="margin-right: 5px;">📋</span>
      <span>Sao chép JSON</span>
    </button>
    <button nz-button nzType="primary" (click)="closeModal()">
      <span>Đóng</span>
    </button>
  </div>
</div>
