<aside class="properties-side-drawer" [class.open]="isVisible && !!nodeProps" [class.is-readonly]="readonly" [attr.aria-label]="'PROCESS_GRAPH.DRAWER.ARIA' | translate">
  <!-- 1. DRAWER HEADER (Tiêu đề + Nút tròn X) -->
  <div class="drawer-header" *ngIf="nodeProps">
    <div class="drawer-title-wrap">
      <!-- Icon loại bước: bấm để đổi icon (áp dụng cho mọi bước cùng loại) -->
      <button type="button" class="drawer-node-icon" *ngIf="headerIcon as icon" [style.background]="icon.bg"
              [class.bordered]="icon.bg === '#ffffff'" [disabled]="readonly" (click)="isIconModalOpen = true"
              [appTooltip]="readonly ? '' : ('PROCESS_GRAPH.ICON_MODAL.EDIT' | translate)">
        <img [src]="icon.src" width="24" height="24" alt="" />
        <span class="drawer-node-badge" *ngIf="!readonly"><img src="assets/icons/processx/edit-badge.svg" width="16" height="16" alt="" /></span>
      </button>
      <h3 class="drawer-title">{{ getDrawerTitle() }}</h3>
      <!-- Điều kiện: đổi loại (chọn 1 / song song / chọn nhiều nhánh) ngay trên header -->
      <ant-select *ngIf="isGateway(nodeProps.type)" class="gateway-type-select" size="small" [disabled]="readonly"
                  [ngModel]="nodeProps.type" (ngModelChange)="changeGatewayType($event)" [options]="gatewayTypeOptions"></ant-select>
    </div>
    <button type="button" class="drawer-close-circle-btn" (click)="onClose()" [attr.aria-label]="'PROCESS_GRAPH.DRAWER.CLOSE_TITLE' | translate">
      <img src="assets/icons/processx/close-modal.svg" width="24" height="24" alt="" />
    </button>
  </div>

  <!-- 2. SCROLLABLE FORM BODY -->
  <!-- Chỉ xem: khoá mọi ô nhập (lớp trong, để thân drawer vẫn cuộn được) -->
  <div class="drawer-body" *ngIf="nodeProps">
  <div [attr.inert]="readonly ? '' : null">

    <!-- ===== CASE 1: BẮT ĐẦU (Trigger) ===== -->
    <div class="start-drawer-section" *ngIf="nodeProps.type === 'START'">
      <app-trigger-node-config [nodeProps]="nodeProps" [errors]="errors"></app-trigger-node-config>
    </div>

    <div class="flat-drawer-section" *ngIf="nodeProps.type === 'JOIN'">
      <div class="form-group-item">
        <label class="drawer-field-label">{{ 'PROCESS_GRAPH.NODE_TYPES.JOIN' | translate }}</label>
        <input nz-input [value]="nodeProps.label || ('PROCESS_GRAPH.NODE_TYPES.JOIN' | translate)" disabled class="readonly-pill-input" />
      </div>
    </div>

    <!-- ===== CASE 2: KẾT THÚC (End) ===== -->
    <div class="start-drawer-section" *ngIf="nodeProps.type === 'END'">
      <app-end-node-config [nodeProps]="nodeProps" [errors]="errors"></app-end-node-config>
    </div>

    <!-- ===== CASE 3: GIAO VIỆC (User Task) ===== -->
    <div class="start-drawer-section" *ngIf="nodeProps.type === 'USER_TASK'">
      <app-task-node-config [nodeProps]="nodeProps" [errors]="errors"></app-task-node-config>
    </div>

    <!-- ===== CASE 4: THÔNG BÁO (Notification) ===== -->
    <div class="start-drawer-section" *ngIf="nodeProps.type === 'NOTIFICATION'">
      <app-notification-node-config [nodeProps]="nodeProps" [errors]="errors"></app-notification-node-config>
    </div>

    <!-- ===== CASE 5: QUY TRÌNH CON (Sub Process) ===== -->
    <div class="start-drawer-section" *ngIf="nodeProps.type === 'SUB_PROCESS'">
      <app-sub-process-node-config [nodeProps]="nodeProps" [errors]="errors"></app-sub-process-node-config>
    </div>

    <!-- ===== CASE 6: TÁC VỤ HỆ THỐNG (Action) ===== -->
    <div class="start-drawer-section" *ngIf="nodeProps.type === 'SYSTEM_TASK'">
      <app-action-node-config [nodeProps]="nodeProps" [errors]="errors"></app-action-node-config>
    </div>

    <!-- ===== CASE 7: ĐIỀU KIỆN (chọn 1 nhánh / song song / chọn nhiều nhánh) — dùng chung UI ===== -->
    <div class="start-drawer-section" *ngIf="isGateway(nodeProps.type)">
      <app-condition-node-config [nodeProps]="nodeProps" [errors]="errors"></app-condition-node-config>
    </div>

  </div>
  </div>

  <!-- 3. FOOTER cố định: Hủy (hoàn tác thay đổi) · Lưu (kiểm tra trường bắt buộc) -->
  <div class="drawer-footer" *ngIf="nodeProps && !readonly">
    <button type="button" class="px-btn px-btn-default" (click)="onClose()">{{ 'PROCESS_GRAPH.COMMON.CANCEL' | translate }}</button>
    <button type="button" class="px-btn px-btn-primary" (click)="onSave()">{{ 'PROCESS_GRAPH.COMMON.SAVE' | translate }}</button>
  </div>
</aside>

<app-node-icon-modal [visible]="isIconModalOpen" [nodeType]="nodeProps?.type || null" (closed)="isIconModalOpen = false"></app-node-icon-modal>
