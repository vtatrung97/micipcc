<div class="canvas-toolbar" role="toolbar" [attr.aria-label]="'PROCESS_GRAPH.TOOLBAR.ARIA' | translate">
  <button type="button" class="canvas-tool-btn" (click)="undo.emit()" [disabled]="!canUndo"
    [appTooltip]="'PROCESS_GRAPH.TOOLBAR.UNDO_TITLE' | translate">
    <img src="assets/icons/processx/flow/toolbar-undo.svg" width="20" height="20" alt="" />
  </button>
  <button type="button" class="canvas-tool-btn" (click)="redo.emit()" [disabled]="!canRedo"
    [appTooltip]="'PROCESS_GRAPH.TOOLBAR.REDO_TITLE' | translate">
    <img src="assets/icons/processx/flow/toolbar-redo.svg" width="20" height="20" alt="" />
  </button>

  <span class="canvas-tool-divider"></span>

  <button type="button" class="canvas-tool-btn" (click)="zoomOut.emit()"
    [appTooltip]="'PROCESS_GRAPH.TOOLBAR.ZOOM_OUT_TITLE' | translate">
    <img src="assets/icons/processx/flow/toolbar-minus.svg" width="20" height="20" alt="" />
  </button>
  <button type="button" class="canvas-zoom-btn" (click)="resetZoom.emit()"
    [appTooltip]="'PROCESS_GRAPH.TOOLBAR.ZOOM_RESET_TITLE' | translate">
    {{ zoom }}%
  </button>
  <button type="button" class="canvas-tool-btn" (click)="zoomIn.emit()"
    [appTooltip]="'PROCESS_GRAPH.TOOLBAR.ZOOM_IN_TITLE' | translate">
    <img src="assets/icons/processx/flow/toolbar-plus.svg" width="20" height="20" alt="" />
  </button>

  <span class="canvas-tool-divider"></span>

  <button type="button" class="canvas-tool-btn" (click)="fit.emit()"
    [appTooltip]="'PROCESS_GRAPH.TOOLBAR.FIT_TITLE' | translate">
    <img src="assets/icons/processx/flow/toolbar-fit.svg" width="20" height="20" alt="" />
  </button>
  <button type="button" class="canvas-tool-btn" (click)="autoLayout.emit()"
    [appTooltip]="'PROCESS_GRAPH.TOOLBAR.AUTO_TITLE' | translate">
    <img src="assets/icons/processx/flow/toolbar-layout.svg" width="20" height="20" alt="" />
  </button>
</div>
