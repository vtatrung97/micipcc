<ng-container *ngIf="visible">
  <div class="dialog-mask" (click)="closed.emit()"></div>
  <div class="dialog-wrap" (click)="closed.emit()">
    <section class="dialog" role="alertdialog" aria-modal="true" [attr.aria-label]="text.title" (click)="$event.stopPropagation()">
      <!-- Icon 32 · tiêu đề + câu xác nhận; nút đóng tròn ở góc -->
      <div class="dialog-body">
        <img class="dialog-icon" [src]="text.icon" width="32" height="32" alt="" />
        <div class="dialog-text">
          <span class="dialog-title">{{ text.title }}</span>
          <p class="dialog-message">{{ text.message }}</p>
        </div>
        <button type="button" class="dialog-close" (click)="closed.emit()" aria-label="Đóng">
          <img src="assets/icons/processx/close-modal.svg" width="24" height="24" alt="" />
        </button>
      </div>

      <div class="dialog-actions">
        <button type="button" class="px-btn px-btn-default" (click)="closed.emit()">Hủy</button>
        <button type="button" class="px-btn px-btn-primary" (click)="confirmed.emit()">{{ text.confirm }}</button>
      </div>
    </section>
  </div>
</ng-container>
