server {
    listen       80;
    server_name  localhost;
    root         /usr/share/nginx/html;

    # Tự động gọt /processX/ khi IPCC gọi sang (hỗ trợ Dual Mode)
    rewrite ^/processX/(.*)$ /$1 last;

    # ==============================================================================
    # DÒNG MỚI THÊM: Tự động gọt /processX/ khi IPCC gọi sang (đáp ứng Dual Mode)
    # ==============================================================================
    rewrite ^/processX/(.*)$ /$1 last;

    # SPA routing cho chế độ Standalone (Web riêng)
    location / {
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;

        # Mở CORS cho Host App kéo nạp remoteEntry.js và các chunks
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
    }

    # Không cache remoteEntry.js để đảm bảo luôn nạp phiên bản mới nhất khi deploy
    location ~* remoteEntry\.js$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Access-Control-Allow-Origin "*" always;
    }

    # Cache dài hạn cho static assets có hash
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
        add_header Access-Control-Allow-Origin "*" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
